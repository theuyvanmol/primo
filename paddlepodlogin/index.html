/* Layout: PaddlePod website header + navy wave band, then a sidebar app shell (sticky pill scroller on phones).
   Single light theme on purpose: it mirrors the PaddlePod website exactly. */
:root{
  --navy:#00223A; --navy-2:#06192A; --ink:#3D5468; --muted:#66788A;
  --yellow:#FEE003; --teal:#309985; --teal-ink:#1E7564; --aqua:#D8F6FB;
  --bg:#F4F7F9; --card:#FFFFFF; --line:#E1E8EE; --white:#FFFFFF;
  --orange:#F0701E; --purple:#5B57A6; --purple-bg:#ECEBF7;
  --red:#B8322A; --red-bg:#FDECEA; --amber-ink:#735600; --amber-bg:#FFF5C7; --green-bg:#E1F3EF;
  --scrim:rgba(0,34,58,.55); --white-70:rgba(255,255,255,.75); --white-15:rgba(255,255,255,.14);
  --display:'Outfit','Avenir Next','Segoe UI',system-ui,sans-serif;
  --body:'Figtree','Segoe UI',system-ui,-apple-system,sans-serif;
  --r:20px; --shadow:0 10px 30px rgba(0,34,58,.07);
  --gut-l:max(16px, env(safe-area-inset-left, 0px)); --gut-r:max(16px, env(safe-area-inset-right, 0px));
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font:15.5px/1.55 var(--body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--navy)}
h1,h2,h3,h4{font-family:var(--display);color:var(--navy);margin:0;text-wrap:balance;letter-spacing:-.4px}
p{margin:0}
button{font:inherit}
a{color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding-left:var(--gut-l);padding-right:var(--gut-r)}

/* demo strip */
.demo{background:var(--navy-2);color:var(--white-70);font:500 13px var(--display)}
.demo .wrap{display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap;padding-block:8px}
.demo b{color:var(--yellow);font-weight:600;letter-spacing:1px;text-transform:uppercase;font-size:11.5px}
.addr{display:inline-flex;align-items:center;gap:6px;background:var(--white-15);border-radius:99px;padding:4px 12px;color:var(--white);font-size:12.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.roles{margin-left:auto;display:inline-flex;background:var(--white-15);border-radius:99px;padding:3px;gap:2px}
.roles button{border:0;background:none;color:var(--white);padding:6px 14px;border-radius:99px;font:600 13px var(--display);cursor:pointer;min-height:32px}
.roles button.on{background:var(--yellow);color:var(--navy)}

/* website header */
.site{background:var(--navy)}
.site .wrap{display:flex;align-items:center;gap:20px;padding-block:14px}
.logo{font:600 30px/1 var(--display);color:var(--white);letter-spacing:-.6px;text-decoration:none;white-space:nowrap}
.logo i{font-style:normal;color:var(--yellow)}
.sitenav{margin-left:auto;display:flex;gap:24px;align-items:center}
.sitenav a{color:var(--white);font:600 15px var(--display);text-decoration:none;cursor:pointer}
.sitenav a:hover{color:var(--yellow)}
.hdr-act{display:flex;gap:10px;align-items:center}
.bell{position:relative;width:44px;height:44px;border-radius:50%;border:0;background:var(--white-15);color:var(--white);display:grid;place-items:center;cursor:pointer}
.bell span{position:absolute;top:4px;right:4px;background:var(--yellow);color:var(--navy);font:700 11px var(--display);min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
@media (max-width:1060px){.sitenav{display:none}.hdr-act{margin-left:auto}}

/* hero band */
.band{background:var(--navy);color:var(--white);position:relative}

main{display:grid;gap:22px;min-width:0;align-content:start}

@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr);gap:18px}

}

/* building blocks */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:22px;min-width:0}

.grid{display:grid;gap:22px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.stack{display:grid;gap:12px}
.hrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:100px;padding:11px 22px;font:600 15px var(--display);cursor:pointer;background:var(--yellow);color:var(--navy);text-decoration:none;min-height:44px;white-space:nowrap}
.btn:hover{filter:brightness(.97)}
.btn.navy{background:var(--navy);color:var(--white)}
.btn.ghost{background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line);color:var(--navy)}
.btn.ghost:hover{box-shadow:inset 0 0 0 1.5px var(--navy)}
.btn.sm{padding:6px 14px;font-size:14px;min-height:36px}
.btn.red{background:var(--red-bg);color:var(--red)}
.btn.link{background:none;padding:6px 0;color:var(--teal-ink);min-height:0}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font:600 12.5px/1.5 var(--display);white-space:nowrap}
.t-green{background:var(--green-bg);color:var(--teal-ink)}
.t-amber{background:var(--amber-bg);color:var(--amber-ink)}
.t-red{background:var(--red-bg);color:var(--red)}
.t-blue{background:var(--aqua);color:var(--navy)}
.t-grey{background:var(--bg);color:var(--muted)}
.t-purple{background:var(--purple-bg);color:var(--purple)}
.t-navy{background:var(--navy);color:var(--white)}
.alert{display:flex;gap:12px 14px;align-items:center;padding:14px 18px;border-radius:16px;flex-wrap:wrap}
.alert svg{flex:none}
.alert .grow{flex:1;min-width:min(100%,220px)}
.row{display:flex;align-items:center;gap:10px 14px;padding:13px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.row:first-child{border-top:0;padding-top:4px}
.row .grow{flex:1;min-width:min(100%,190px)}
.row b,.row strong{color:var(--navy);font-family:var(--display);font-weight:600}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:600 14px var(--display);color:var(--navy);background:var(--aqua);flex:none}
.av.y{background:var(--yellow)} .av.p{background:var(--purple-bg);color:var(--purple)} .av.g{background:var(--green-bg);color:var(--teal-ink)}
.tbl{overflow-x:auto;margin-inline:-6px}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{text-align:left;font:600 12px var(--display);text-transform:uppercase;letter-spacing:.8px;color:var(--muted);padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 10px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
td b{color:var(--navy);font-weight:600}
tr:last-child td{border-bottom:0}
.num{font-variant-numeric:tabular-nums;text-align:right}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:14px}
.kpi{background:var(--card);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow)}

.form{display:grid;gap:14px}
.form .two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:14px}

input[type=text],input[type=email],input[type=search],input[type=date],input[type=time],select,textarea{font:15px var(--body);padding:10px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--navy);width:100%;min-height:44px}

.seg{display:inline-flex;background:var(--bg);border-radius:99px;padding:4px;gap:2px;flex-wrap:wrap}

.msgs{display:flex;flex-direction:column;gap:10px;max-height:440px;overflow-y:auto;padding:4px 2px}

.lock{position:absolute;inset:-8px;background:rgba(244,247,249,.9);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);border-radius:var(--r);z-index:5;display:grid;place-items:start center;padding:24px 12px}

.more{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]'); if(!el) return;
  if(el.tagName==='SELECT') return;
  if(el.tagName==='INPUT'&&el.type==='checkbox'){ACT[el.dataset.a]&&ACT[el.dataset.a](el.dataset,el,e);return}
  const f=ACT[el.dataset.a]; if(!f) return;
  if(el.dataset.a==='scrim'&&e.target!==el) { /* clicks inside modal: find inner action */ return; }
  e.preventDefault(); f(el.dataset,el,e);
});

  if(t.av==='photo'&&t.photo) return `<span class="cav" style="${st}"><img src="${t.photo}" alt="Profile photo"></span>`;

  return `<span class="cav" style="${st};background:${t.bg}">${charSvg(t.char)}</span>`;
}

async function saveFile(data,filename,done){
  let dl=null; try{dl=window.claude?await window.claude.use('downloads'):null}catch(e){}
  if(!dl){try{const b=data instanceof Blob?data:new Blob([data],{type:filename.endsWith('.csv')?'text/csv':'application/octet-stream'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast(done||'Saved.')}catch(e){toast('The file could not be saved here.')}return}
  try{await dl.save({filename,data});toast(done||'Saved.')}catch(e){if(e&&e.code==='declined')return;toast('The file could not be saved here.')}
}

function pers(s,f,raw){const m={parent_name:f.parent,swimmer_name:f.swimmer,class:f.cls,lesson_time:f.time,venue:f.venue};return (raw?String(s??''):esc(s)).replace(/\{(\w+)\}/g,(x,k)=>m[k]??x)}
function inl(s,f){return pers(s,f).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<span style="text-decoration:underline;font-weight:600">$1</span>')}
function mdLite(s,f){let out='',ul=false;for(const ln of String(s||'').split('\n')){const li=/^\s*-\s+/.test(ln);if(li){if(!ul){out+='<ul style="margin:0;padding-left:20px">';ul=true}out+=`<li>${inl(ln.replace(/^\s*-\s+/,''),f)}</li>`}else{if(ul){out+='</ul>';ul=false}out+=ln.trim()?`<div>${inl(ln,f)}</div>`:'<div style="height:10px"></div>'}}if(ul)out+='</ul>';return out}
function sanitize(html){try{const doc=new DOMParser().parseFromString(`<div>${html}</div>`,'text/html'),root=doc.body.firstChild;root.querySelectorAll('script,style,link,meta,base,iframe,object,embed,form,input,button,textarea,select,frame,frameset,svg,math,template,video,audio').forEach(n=>n.remove());root.querySelectorAll('*').forEach(el=>{[...el.attributes].forEach(a=>{const n=a.name.toLowerCase(),v=a.value.trim().toLowerCase();if(n.startsWith('on')||n==='href'||n==='xlink:href'||n==='srcset'||n==='id'||n==='class'||(n==='src'&&!v.startsWith('data:image/'))||(n==='style'&&/(url\(|expression|position\s*:\s*(fixed|absolute|sticky))/.test(v)))el.removeAttribute(a.name)})});return root.innerHTML}catch(e){return ''}}
function blockHTML(b,d,f,ff,r,ph){
  const al=b.align==='center'?'center':'left';
  switch(b.t){
    case 'h':{const sz={L:ph?24:30,M:ph?20:24,S:ph?17:19}[b.size||'M'];return `<h2 style="margin:0;font:600 ${sz}px/1.2 ${ff};color:${d.header};text-align:${al};letter-spacing:-.3px">${pers(b.v,f)}</h2>`}
    case 'p':return `<div style="font:400 ${ph?15:15.5}px/1.6 ${ff};color:#3D5468;text-align:${al}">${mdLite(b.v,f)}</div>`;
    case 'btn':{const full=b.align==='full',st=b.style==='outline'?`background:transparent;color:${d.header};box-shadow:inset 0 0 0 2px ${d.header}`:`background:${d.btn};color:${d.btnText}`;return `<div style="text-align:${full?'center':al}"><span style="display:${full?'block':'inline-block'};${st};padding:13px 28px;border-radius:${d.corners==='square'?'6px':'999px'};font:600 15px/1.2 ${ff}">${pers(b.v,f)}</span></div>`}
    case 'img':{const w={full:'100%',wide:'75%',half:'50%'}[b.w||'full'];return `<figure style="margin:0;text-align:center">${b.src?`<img src="${b.src}" alt="${esc(b.alt)}" style="width:${w};max-width:100%;border-radius:${r};display:inline-block;vertical-align:top">`:`<div style="width:${w};max-width:100%;margin:0 auto;aspect-ratio:16/8;border-radius:${r};background:#D8F6FB;display:grid;place-items:center;color:#1E7564;font:600 13px/1.5 ${ff};text-align:center"><span>${ico('img',30)}<br>Add a photo or poster</span></div>`}${b.cap?`<figcaption style="font:400 13px ${ff};color:#66788A;margin-top:8px">${pers(b.cap,f)}</figcaption>`:''}</figure>`}
    case 'box':{const T={yellow:['#FFF5C7','#00223A'],aqua:['#D8F6FB','#00223A'],navy:[d.header,'#FFFFFF']}[b.tone||'yellow'];return `<div style="background:${T[0]};border-radius:${r};padding:18px 20px;color:${T[1]}"><div style="font:600 16px/1.3 ${ff}">${pers(b.title,f)}</div><div style="font:400 15px/1.55 ${ff};margin-top:6px">${mdLite(b.v,f)}</div></div>`}
    case 'hr':return `<hr style="border:0;border-top:1px solid #E1E8EE;margin:4px 0">`;
    case 'space':return `<div style="height:${{S:8,M:20,L:40}[b.h||'M']}px"></div>`;
    case 'code':return `<div style="overflow-wrap:anywhere;max-width:100%;overflow:hidden">${sanitize(pers(b.v,f,true))}</div>`;
  }
  return '';
}
function emailDoc(c,f,mode,live){
  const d={...DZ,...(c.design||{})},ph=mode==='phone',ff=d.font==='Georgia'?"Georgia,'Times New Roman',serif":`'${d.font}','Segoe UI',system-ui,sans-serif`,r=d.corners==='square'?'4px':'12px';

function plainText(c,f){const o=[];(c.blocks||[]).forEach(b=>{if(b.t==='h')o.push(pers(b.v,f,true).toUpperCase());else if(b.t==='p')o.push(pers(b.v,f,true).replace(/\*\*(.+?)\*\*/g,'$1').replace(/\[([^\]]+)\]\(([^)]+)\)/g,'$1 ($2)'));else if(b.t==='btn')o.push(`${pers(b.v,f,true)}: ${b.url||''}`);else if(b.t==='box')o.push(`${pers(b.title,f,true)}\n${pers(b.v,f,true)}`);else if(b.t==='hr')o.push('----------');else if(b.t==='img'&&b.alt)o.push(`[Image: ${b.alt}]`);else if(b.t==='code')o.push(pers(b.v,f,true).replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim())});o.push('--\nPaddlePod · paddlepod.co.uk\nUnsubscribe: [link]');return o.filter(Boolean).join('\n\n')}
function audN3(c){let n;if(!c.aud||!c.aud.length)return 0;if(c.aud.includes('all'))n=1214;else{const s=c.aud.map(k=>(SEG.find(x=>x[0]===k)||[0,0,0])[2]);n=Math.min(1214,Math.round(s.reduce((a,b)=>a+b,0)*(s.length>1?.9:1)))}(c.excl||[]).forEach(k=>n-=(EXCL.find(x=>x[0]===k)||[0,0,0])[2]);return Math.max(0,n)}
function audLabel(c){if(!Array.isArray(c.aud))return c.aud||'';return c.aud.includes('all')?'Everyone subscribed':c.aud.map(k=>(SEG.find(x=>x[0]===k)||[0,k])[1]).join(', ')}
function campFrom(t){const base=t||S.templates[0];return {id:Date.now(),name:'',subj:'',pre:'',from:'PaddlePod',reply:'hello@paddlepod.co.uk',look:base.look,design:{...DZ,...clone3(base.design||{})},blocks:clone3(base.blocks),aud:['all'],excl:['overdue'],status:'Draft',tpl:base.id,step:1,when:'',n:1214,sent:null,fail:0,open:null,click:null,schedule:'now'}}
function ensureCamp(c){const t=S.templates.find(x=>x.id==c.tpl)||S.templates[0];const e={...campFrom(t),...clone3(c)};if(!Array.isArray(e.aud))e.aud=AUDMAP[c.aud]||['all'];if(!e.blocks||!e.blocks.length)e.blocks=clone3(t.blocks);if(!e.look)e.look=t.look;e.design={...DZ,...(c.design||t.design||{})};e.step=1;return e}

function pmenuHTML(target){return `<div class="pwrap"><button type="button" class="pbtn" data-a="pmenu" data-t="${target}" aria-haspopup="true">${ico('user',14)} Personalise</button><div class="pmenu" id="pm-${target}" hidden>${PTAGS.map(t=>`<button type="button" data-a="ptag" data-t="${target}" data-k="${t[0]}">${t[1]}<span>{${t[0]}}</span></button>`).join('')}</div></div>`}
function segOpt(i,k,cur,opts){return `<div class="seg">${opts.map(o=>`<button type="button" class="${cur===o[0]?'on':''}" data-a="bOpt" data-i="${i}" data-k="${k}" data-v="${o[0]}">${o[1]}</button>`).join('')}</div>`}
function bSummary(b){const t=s=>String(s||'').replace(/\*\*/g,'').replace(/\n/g,' ');return b.t==='h'||b.t==='p'||b.t==='btn'?t(b.v):b.t==='img'?(b.src?(b.alt||'Image added'):'No image yet'):b.t==='box'?t(b.title):b.t==='space'?{S:'Small',M:'Medium',L:'Large'}[b.h||'M']:b.t==='code'?'Your own HTML':''}
function bFields(b,i){

  return '';
}
function blocksHTML(){const c=S.edit;return c.blocks.map((b,i)=>{const T=BTYPES.find(x=>x[0]===b.t),open=S.selBlock===i;return `<div class="bitem ${open?'open':''}" id="bi${i}"><div class="bhead"><button type="button" class="bsel" data-a="selBlock" data-i="${i}" aria-expanded="${open}"><span class="bic">${ico(T[3],16)}</span><span class="bname">${T[1]}</span><span class="bsum">${esc(bSummary(b))}</span></button><div class="bctl"><button type="button" class="ib" data-a="bMove" data-i="${i}" data-d="-1" aria-label="Move up" ${i?'':'disabled'}>${ico('up',15)}</button><button type="button" class="ib" data-a="bMove" data-i="${i}" data-d="1" aria-label="Move down" ${i<c.blocks.length-1?'':'disabled'}>${ico('down',15)}</button><button type="button" class="ib" data-a="bDup" data-i="${i}" aria-label="Duplicate">${ico('copy',15)}</button><button type="button" class="ib red" data-a="bDel" data-i="${i}" aria-label="Remove">${ico('trash',15)}</button></div></div>${open?`<div class="bbody">${bFields(b,i)}</div>`:''}</div>`}).join('')}

  `<button class="btn navy" data-a="postSave" data-id="${p?p.id:''}" data-st="Scheduled">${ico('clock',18)} Schedule</button><button class="btn ghost" data-a="postSave" data-id="${p?p.id:''}" data-st="Draft">Save as draft</button>`)}
Object.assign(ACT,{
  mktTab(d){S.mkt.tab=d.t;render()},
  mktM(d){S.mkt.m=Math.min(11,Math.max(9,S.mkt.m+(+d.d)));render()},
  postOpen(d){S.mkt.delId=null;postModal(S.posts.find(p=>p.id==d.id))},
  postNew(){postForm(null)},
  postEdit(d){postForm(S.posts.find(p=>p.id==d.id))},
  postDup(d){const p=S.posts.find(x=>x.id==d.id);postForm({...p,id:null,res:null,st:'Draft',d:'2026-11-19',t:'18:30'});document.querySelector('#modal h2').textContent='Schedule a post'},
  postSched(d){const p=S.posts.find(x=>x.id==d.id);p.st='Scheduled';logIt(ME(),'Marketing',`Scheduled "${p.title}" for ${fmtD(p.d)}, ${p.t}`);close();render();toast(`Scheduled for ${fmtD(p.d)} at ${p.t}.`)},
  postDel(d){if(S.mkt.delId!==+d.id){S.mkt.delId=+d.id;postModal(S.posts.find(p=>p.id==d.id));return}S.posts=S.posts.filter(p=>p.id!=d.id);S.mkt.delId=null;close();render();toast('Post deleted.')},
  postSave(d){const ch=[...document.querySelectorAll('.pch:checked')].map(x=>x.value),t=val('poT').trim();if(!ch.length){toast('Choose at least one channel.');return}if(!t){toast('Give the post a title.');return}
    const data={ch,title:t,cap:val('poC'),d:val('poD')||'2026-11-13',t:val('poH')||'18:30',type:val('poY'),st:d.st,img:S.postImg};
    if(d.id){Object.assign(S.posts.find(p=>p.id==d.id),data)}else S.posts.push({id:Date.now(),...data});
    const mo=+data.d.slice(5,7)-1;if(mo>=9&&mo<=11)S.mkt.m=mo;S.mkt.tab='cal';logIt(ME(),'Marketing',`${d.st==='Draft'?'Saved a draft post':'Scheduled a post'}: ${t}`);close();render();toast(d.st==='Draft'?'Draft saved to the calendar.':`Scheduled for ${fmtD(data.d)} at ${data.t} on ${chNames(ch)}.`)}
});
document.addEventListener('input',e=>{if(e.target.id==='poC'){const n=$('#poN');if(n)n.textContent=e.target.value.length.toLocaleString()+' of 2,200 characters'}});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='poI'&&el.files&&el.files[0]){const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,1000/im.width),cv=document.createElement('canvas');cv.width=Math.round(im.width*sc);cv.height=Math.round(im.height*sc);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);S.postImg=cv.toDataURL('image/jpeg',.82);$('#poIn').textContent='Photo added'};im.src=rd.result};rd.readAsDataURL(el.files[0])}});
/* tooltips + line chart hover */
const tipEl=document.createElement('div');tipEl.className='tip';tipEl.hidden=true;document.body.appendChild(tipEl);
function showTip(html,x,y){tipEl.innerHTML=html;tipEl.hidden=false;const w=tipEl.offsetWidth,h=tipEl.offsetHeight;tipEl.style.left=Math.min(innerWidth-w-8,Math.max(8,x+14))+'px';tipEl.style.top=Math.max(8,y-h-12)+'px'}
document.addEventListener('pointermove',e=>{
  const t=e.target.closest&&e.target.closest('[data-tip]');
  const lc=e.target.closest&&e.target.closest('[data-lc]');
  if(lc){const r=lc.getBoundingClientRect(),i=Math.max(0,Math.min(SESS.length-1,Math.round((e.clientX-r.left)/r.width*(SESS.length-1)))),x=i/(SESS.length-1)*100,y=100-SESS[i]/1400*100;const cr=lc.querySelector('.cross'),dt=lc.querySelector('.dot');cr.hidden=false;dt.hidden=false;cr.style.left=x+'%';dt.style.left=x+'%';dt.style.top=y+'%';showTip(`<b>${SESSD[i]}</b><br>${SESS[i].toLocaleString()} sessions`,e.clientX,e.clientY);return}
  document.querySelectorAll('[data-lc] .cross,[data-lc] .dot').forEach(x=>x.hidden=true);
  if(t){showTip(t.dataset.tip,e.clientX,e.clientY)}else tipEl.hidden=true;
});
document.addEventListener('pointerleave',()=>{tipEl.hidden=true},true);
window.addEventListener('scroll',()=>{tipEl.hidden=true},{passive:true});

const _render3=render;
render=function(sc){if(S.role==='admin'&&BLOCK_ADMIN.includes(S.view))S.view='dash';if(!VIEWS[S.role][S.view])S.view=FIRST[S.role];_render3(sc);document.querySelectorAll('.dbtn').forEach(b=>b.classList.toggle('on',S.view==='features'));};

function fromHash(){const h=location.hash.slice(1).split('-');if(VIEWS[h[0]]&&VIEWS[h[0]][h[1]]){S.role=h[0];S.view=h[1];}}
window.addEventListener('hashchange',()=>{const before=S.role+'-'+S.view;fromHash();if(S.role+'-'+S.view!==before)render();});
fromHash(); render();
</script></body></html>
